<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="as" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1600" height="1010" fill="#ffffff"/>
  <text x="800" y="22" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">API de Gestión de Recursos del Pesebre — Arquitectura en capas (Laravel)</text>

  <!-- Límite de la API -->
  <rect x="20" y="118" width="1040" height="812" rx="14" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="34" y="140" font-size="13" fill="#64748b">API Pesebre (Laravel · puerto 8000)</text>

  <!-- Cliente -->
  <rect x="560" y="38" width="440" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="780" y="64" text-anchor="middle" font-size="17" font-weight="bold" fill="#0c4a6e">Cliente — Postman</text>
  <text x="780" y="86" text-anchor="middle" font-size="13" fill="#0c4a6e">HTTP + JSON · Authorization: Bearer &lt;token&gt;</text>

  <!-- Entrada -->
  <rect x="560" y="150" width="440" height="62" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="780" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Entrada de la API  /api/*</text>
  <text x="780" y="198" text-anchor="middle" font-size="13" fill="#334155">Middleware ValidarJson: cuerpo JSON mal formado → 400</text>

  <!-- Seguridad -->
  <rect x="560" y="250" width="440" height="62" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="780" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">Middleware de seguridad — VerificarRol</text>
  <text x="780" y="298" text-anchor="middle" font-size="13" fill="#713f12">Sin token → 401 · rol distinto (PASTOR) → 403 · tokens en .env</text>

  <!-- Rutas -->
  <rect x="560" y="350" width="440" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="374" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">Rutas — routes/api.php</text>
  <text x="780" y="395" text-anchor="middle" font-size="13" fill="#4c1d95">PATCH /recursos/{id}/reabastecimiento → controlador</text>

  <!-- Controladores -->
  <rect x="560" y="444" width="440" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">Controladores — Recurso / Animal / Pesebre</text>
  <text x="780" y="492" text-anchor="middle" font-size="13" fill="#4c1d95">FormRequest valida formato (400) · traduce resultado a HTTP · sin reglas</text>

  <!-- Servicios -->
  <rect x="560" y="548" width="440" height="122" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="780" y="574" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Servicios: RecursoService · AnimalService · PesebreService</text>
  <text x="780" y="598" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">★ Aquí viven TODAS las reglas de negocio (1 a 6)</text>
  <text x="780" y="620" text-anchor="middle" font-size="13" fill="#14532d">Regla 1 estado · 2 consumo 409 · 3 alimento 409 · 4 un día 422</text>
  <text x="780" y="640" text-anchor="middle" font-size="13" fill="#14532d">5 SOAP: DISPONIBLE suma / SIN_EXISTENCIAS 422 · 6 eliminar 409</text>
  <text x="780" y="660" text-anchor="middle" font-size="13" fill="#14532d">Transacciones: si falla, no se descuenta nada</text>

  <!-- Repositorios -->
  <rect x="560" y="708" width="440" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="780" y="732" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Repositorios — RecursoRepository · AnimalRepository</text>
  <text x="780" y="752" text-anchor="middle" font-size="13" fill="#334155">Único acceso a las tablas (Eloquent)</text>

  <!-- Datos -->
  <path d="M600,812 a180,14 0 0,0 360,0 v66 a180,14 0 0,1 -360,0 z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <ellipse cx="780" cy="812" rx="180" ry="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="780" y="852" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Datos — SQLite</text>
  <text x="780" y="872" text-anchor="middle" font-size="13" fill="#334155">tablas recursos · animales</text>

  <!-- Flechas centrales (llamadas) -->
  <line x1="760" y1="100" x2="760" y2="148" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="800" y1="148" x2="800" y2="102" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="812" y="130" font-size="12" fill="#16a34a">respuesta JSON 200/201/202/204</text>
  <text x="640" y="130" font-size="12" fill="#334155">petición HTTP</text>
  <line x1="780" y1="212" x2="780" y2="248" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="780" y1="312" x2="780" y2="348" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="780" y1="406" x2="780" y2="442" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="780" y1="510" x2="780" y2="546" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="780" y1="670" x2="780" y2="706" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="780" y1="764" x2="780" y2="796" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- Manejador global de errores -->
  <rect x="40" y="350" width="400" height="320" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="240" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">Manejador global de errores</text>
  <text x="240" y="398" text-anchor="middle" font-size="13" fill="#7f1d1d">bootstrap/app.php → withExceptions()</text>
  <text x="60" y="432" font-size="13" fill="#7f1d1d">• ValidationException → 400 FORMATO_INVALIDO</text>
  <text x="60" y="456" font-size="13" fill="#7f1d1d">• ApiException → 404 / 409 / 422</text>
  <text x="60" y="480" font-size="13" fill="#7f1d1d">• Ruta inexistente → 404</text>
  <text x="60" y="504" font-size="13" fill="#7f1d1d">• MercadoNoDisponible (red de seguridad) → 503</text>
  <text x="60" y="528" font-size="13" fill="#7f1d1d">• Cualquier otra → 500 controlado</text>
  <text x="240" y="566" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Formato ÚNICO de error:</text>
  <text x="240" y="588" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#7f1d1d">{ codigo, mensaje, detalles,</text>
  <text x="240" y="606" text-anchor="middle" font-size="12" font-family="Menlo, monospace" fill="#7f1d1d">  timestamp, ruta }</text>
  <text x="240" y="640" text-anchor="middle" font-size="12" fill="#7f1d1d">(401/403 del middleware usan el mismo formato)</text>

  <!-- excepciones hacia el manejador -->
  <path d="M560,477 L442,477" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <path d="M560,620 L442,620" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <text x="448" y="470" font-size="12" fill="#dc2626">excepción</text>
  <text x="448" y="613" font-size="12" fill="#dc2626">excepción</text>
  <!-- error al cliente -->
  <path d="M240,350 L240,69 L558,69" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <text x="250" y="60" font-size="12" fill="#dc2626">respuesta de error JSON (400/401/403/404/409/422)</text>

  <!-- Adaptador -->
  <rect x="1120" y="548" width="440" height="122" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1340" y="574" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Adaptador SOAP — MercadoAdapter</text>
  <text x="1340" y="598" text-anchor="middle" font-size="13" fill="#7c2d12">Única clase que conoce XML: objeto ↔ XML</text>
  <text x="1340" y="620" text-anchor="middle" font-size="13" fill="#7c2d12">Devuelve ResultadoExistencias (DISPONIBLE / SIN_EXISTENCIAS)</text>
  <text x="1340" y="642" text-anchor="middle" font-size="13" fill="#7c2d12">timeout 3 s · 2 intentos con backoff exponencial</text>

  <line x1="1000" y1="595" x2="1118" y2="595" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1006" y="586" font-size="11" fill="#334155">consultarExistencias()</text>
  <line x1="1118" y1="628" x2="1002" y2="628" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="1006" y="646" font-size="11" fill="#16a34a">resultado / excepción</text>

  <!-- Externo -->
  <rect x="1100" y="820" width="480" height="110" rx="14" fill="none" stroke="#64748b" stroke-dasharray="6 5"/>
  <text x="1566" y="840" text-anchor="end" font-size="12" fill="#64748b">Sistema externo (no reemplazable)</text>
  <rect x="1140" y="848" width="400" height="66" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="1340" y="874" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">MercadoBelenService (SOAP)</text>
  <text x="1340" y="896" text-anchor="middle" font-size="13" fill="#334155">ConsultarExistencias · mock: php -S :8081</text>

  <line x1="1160" y1="670" x2="1160" y2="846" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1150" y="700" text-anchor="end" font-size="12" fill="#334155">POST XML</text>
  <line x1="1190" y1="846" x2="1190" y2="672" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>

  <!-- Punto de fallo -->
  <rect x="1210" y="688" width="384" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="1222" y="714" font-size="15" font-weight="bold" fill="#b91c1c">⚡ Punto de gestión del fallo</text>
  <text x="1222" y="736" font-size="12" fill="#7f1d1d">soap:Fault ("Mercado cerrado", cantidad 999)</text>
  <text x="1222" y="755" font-size="12" fill="#7f1d1d">o sin respuesta en 3 s → MercadoNoDisponibleException</text>
  <text x="1222" y="774" font-size="12" fill="#7f1d1d">RecursoService: estado REABASTECIMIENTO_PENDIENTE,</text>
  <text x="1222" y="793" font-size="12" fill="#7f1d1d">cantidad igual → 202 Accepted (nunca 500)</text>

  <!-- Leyenda -->
  <line x1="40" y1="975" x2="90" y2="975" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="98" y="980" font-size="13" fill="#334155">sentido de la llamada</text>
  <line x1="270" y1="975" x2="320" y2="975" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="328" y="980" font-size="13" fill="#334155">respuesta / retorno</text>
  <line x1="490" y1="975" x2="540" y2="975" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
  <text x="548" y="980" font-size="13" fill="#334155">excepción / error</text>
  <text x="720" y="980" font-size="13" fill="#334155">★ lógica de negocio   ⚡ manejo de fallo distribuido</text>
</svg>
